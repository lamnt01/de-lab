# DE practice lab: Hadoop (HDFS/YARN) + Spark standalone + Kafka (KRaft) + Airflow
# Bật theo profile để tiết kiệm RAM, ví dụ:
#   docker compose --profile hadoop --profile spark up -d
#   docker compose --profile all up -d

x-airflow-common: &airflow-common
  build: ./airflow
  image: de-lab-airflow:2.10.5
  profiles: ["airflow", "all"]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: de-lab-secret
    AIRFLOW_CONN_SPARK_DEFAULT: spark://spark-master:7077
    AIRFLOW_UID: ${AIRFLOW_UID:-50000}
    SPARK_CONF_DIR: /opt/spark-conf
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./spark/conf:/opt/spark-conf
    - ./spark/jobs:/opt/spark-jobs
    - ./data:/opt/data
    - ./kafka:/opt/kafka-scripts
  user: "${AIRFLOW_UID:-50000}:0"

x-hadoop-common: &hadoop-common
  image: apache/hadoop:3.3.6
  env_file: ./hadoop.env

services:
  # ---------------- Hadoop ----------------
  namenode:
    <<: *hadoop-common
    profiles: ["hadoop", "all"]
    hostname: namenode
    container_name: namenode
    command: ["hdfs", "namenode"]
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop/dfs/name
    ports:
      - "9870:9870"   # HDFS web UI

  datanode:
    <<: *hadoop-common
    profiles: ["hadoop", "all"]
    hostname: datanode
    container_name: datanode
    command: ["hdfs", "datanode"]
    depends_on: [namenode]
    ports:
      - "9864:9864"

  # YARN: chỉ cần khi muốn thử MapReduce / Spark-on-YARN
  resourcemanager:
    <<: *hadoop-common
    profiles: ["yarn"]
    hostname: resourcemanager
    container_name: resourcemanager
    command: ["yarn", "resourcemanager"]
    ports:
      - "8088:8088"   # YARN web UI

  nodemanager:
    <<: *hadoop-common
    profiles: ["yarn"]
    hostname: nodemanager
    container_name: nodemanager
    command: ["yarn", "nodemanager"]
    depends_on: [resourcemanager]

  # ---------------- Spark ----------------
  spark-master:
    image: spark:3.5.3-python3
    profiles: ["spark", "all"]
    hostname: spark-master
    container_name: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8090:8080"   # Spark master UI
      - "7077:7077"
      - "4040:4040"   # UI của job khi submit từ container này
    environment:
      SPARK_CONF_DIR: /opt/spark-conf
    volumes:
      - ./spark/conf:/opt/spark-conf
      - ./spark/jobs:/opt/spark-jobs
      - ./data:/opt/data

  spark-worker:
    image: spark:3.5.3-python3
    profiles: ["spark", "all"]
    hostname: spark-worker
    container_name: spark-worker
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "2", "--memory", "2g"]
    environment:
      SPARK_WORKER_DIR: /tmp/spark-work
      PYSPARK_PYTHON: python3
      SPARK_CONF_DIR: /opt/spark-conf
    depends_on: [spark-master]
    ports:
      - "8091:8081"   # Spark worker UI
    volumes:
      - ./spark/conf:/opt/spark-conf
      - ./spark/jobs:/opt/spark-jobs
      - ./data:/opt/data

  # ---------------- Kafka ----------------
  kafka:
    image: apache/kafka:3.9.0
    profiles: ["kafka", "all"]
    hostname: kafka
    container_name: kafka
    ports:
      - "9094:9094"   # cho client chạy trên máy Windows
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: ["kafka", "all"]
    container_name: kafka-ui
    depends_on: [kafka]
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ---------------- Airflow ----------------
  airflow-db:
    image: postgres:16
    profiles: ["airflow", "all"]
    container_name: airflow-db
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    command: version
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: airflow
    depends_on:
      airflow-db:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    hostname: airflow-scheduler   # Spark driver chạy ở đây khi DAG submit job
    container_name: airflow-scheduler
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
