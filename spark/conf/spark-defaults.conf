# Cấu hình chung cho mọi Spark job (spark-master, spark-worker, Airflow đều đọc qua SPARK_CONF_DIR)
spark.master                     spark://spark-master:7077
# Replication do client quyết định khi ghi file; cụm chỉ có 1 datanode nên phải ghi 1 bản
spark.hadoop.fs.defaultFS        hdfs://namenode:8020
spark.hadoop.dfs.replication     1
