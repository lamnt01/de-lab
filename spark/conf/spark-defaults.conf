# Cấu hình chung cho mọi Spark job (spark-master, spark-worker, Airflow đều đọc qua SPARK_CONF_DIR)
spark.master                     spark://spark-master:7077
# Replication do client quyết định khi ghi file; cụm chỉ có 1 datanode nên phải ghi 1 bản
spark.hadoop.fs.defaultFS        hdfs://namenode:8020
spark.hadoop.dfs.replication     1

# Lakehouse: Delta Lake 3.3.x là bản tương thích với Spark 3.5.x
# Khai báo cả Kafka connector ở đây vì `--packages` trên dòng lệnh sẽ GHI ĐÈ (không cộng thêm) giá trị này
spark.jars.packages              io.delta:delta-spark_2.12:3.3.3,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3
# Thư mục cache jar tải về; thư mục mặc định trong home của user spark không ghi được
spark.jars.ivy                   /tmp/.ivy2
spark.sql.extensions             io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog  org.apache.spark.sql.delta.catalog.DeltaCatalog
